[package]
name = "git-vdb-caos"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
git-vdb = { path = "../.." }
git2 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[[bin]]
name = "git-vdb-caos-worker"
path = "src/main.rs"
